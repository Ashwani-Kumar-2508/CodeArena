version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codearena_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codearena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codearena"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codearena_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/codearena?schema=public"
      JWT_SECRET: "codearena_super_secure_jwt_production_secret_key_2026"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:5000"
    depends_on:
      postgres:
        condition: service_healthy

  execution-worker:
    build:
      context: ./execution-worker
      dockerfile: Dockerfile
    container_name: codearena_execution_worker
    restart: unless-stopped
    environment:
      PORT: 6000
      NODE_ENV: production
      MAX_EXECUTION_TIME_MS: 3000
      MAX_MEMORY_MB: 128
    ports:
      - "6000:6000"

volumes:
  postgres_data:
