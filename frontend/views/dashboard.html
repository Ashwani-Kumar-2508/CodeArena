<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CodeArena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Nav -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2 font-black text-xl tracking-tight text-white">
          <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-mono text-white shadow-lg shadow-indigo-600/30">⚔</span>
          Code<span class="text-indigo-400">Arena</span>
        </a>
        <a href="/views/dashboard.html" class="text-sm font-semibold text-indigo-400">Interviews</a>
        <a href="/views/problems.html" class="text-sm font-medium text-slate-400 hover:text-slate-200 transition">Questions</a>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <span id="user-display-name" class="text-sm font-semibold text-slate-200"></span>
          <span id="user-role-badge"></span>
        </div>
        <button onclick="Auth.logout()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-400 hover:text-rose-400 transition">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 id="dashboard-title" class="text-2xl font-black text-white">Workspace</h1>
        <p id="dashboard-subtitle" class="text-sm text-slate-400 mt-1">Manage technical interview sessions</p>
      </div>

      <button id="new-interview-btn" onclick="openModal('create-interview-modal')" class="hidden px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-semibold text-white rounded-xl shadow-lg shadow-indigo-600/20 text-sm transition flex items-center gap-2 self-start md:self-auto">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Schedule Interview
      </button>
    </div>

    <!-- Interviews Container -->
    <div id="interviews-list" class="space-y-4">
      <div class="p-8 text-center text-slate-500">Loading interview sessions...</div>
    </div>

    <!-- Empty State -->
    <div id="interviews-empty" class="hidden glass-panel p-12 rounded-2xl text-center">
      <div class="w-12 h-12 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 mx-auto mb-4 font-mono text-xl">⚔</div>
      <h3 class="text-lg font-bold text-slate-200 mb-1">No interviews scheduled yet</h3>
      <p class="text-sm text-slate-400 max-w-sm mx-auto mb-6">Create a technical interview session to invite a candidate and evaluate their problem solving.</p>
    </div>
  </main>

  <!-- Create Interview Modal -->
  <div id="create-interview-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-panel bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-5">
        <h3 class="text-lg font-bold text-white">Create Technical Interview</h3>
        <button onclick="closeModal('create-interview-modal')" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <div id="create-error" class="hidden mb-4 p-3 rounded-lg bg-rose-950/40 border border-rose-800 text-xs text-rose-300"></div>

      <form id="create-interview-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Interview Title</label>
          <input type="text" name="title" required placeholder="e.g. Senior Frontend Engineer Technical Screen" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Description / Focus Areas</label>
          <textarea name="description" rows="2" placeholder="e.g. Algorithms, Data Structures, Concurrency" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Candidate Email</label>
            <input type="email" name="candidateEmail" placeholder="candidate@codearena.dev" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" />
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Duration (Minutes)</label>
            <input type="number" name="durationMinutes" value="60" min="15" max="180" class="w-full px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-indigo-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Select Questions to Assign</label>
          <div id="modal-questions-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
            <div class="text-xs text-slate-500">Loading question templates...</div>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
          <button type="button" onclick="closeModal('create-interview-modal')" class="px-4 py-2 text-sm text-slate-400 hover:text-white transition">Cancel</button>
          <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/20 transition">Create & Schedule</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
