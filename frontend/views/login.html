<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CodeArena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-6 selection:bg-indigo-500 selection:text-white">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2.5 font-black text-2xl tracking-tight text-white mb-2">
        <span class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-mono text-white text-base shadow-lg shadow-indigo-600/30">⚔</span>
        Code<span class="text-indigo-400">Arena</span>
      </a>
      <h2 class="text-xl font-bold text-slate-100 mt-2">Sign In to CodeArena</h2>
      <p class="text-sm text-slate-400 mt-1">Real-time collaborative technical interview platform</p>
    </div>

    <!-- Form Card -->
    <div class="glass-panel p-8 rounded-2xl shadow-2xl border border-slate-800">
      <div id="error-message" class="hidden mb-5 p-3.5 rounded-xl bg-rose-950/50 border border-rose-800 text-xs text-rose-300 font-medium"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5" for="email">Work or Candidate Email</label>
          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700/80 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            placeholder="you@company.com"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400" for="password">Password</label>
          </div>
          <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
            class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700/80 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white shadow-lg shadow-indigo-600/20 transition text-sm flex items-center justify-center gap-2 mt-2"
        >
          Sign In
        </button>
      </form>

      <div class="pt-6 mt-6 border-t border-slate-800/80 text-center">
        <p class="text-xs text-slate-400">
          New to CodeArena?
          <a href="/views/register.html" class="text-indigo-400 hover:text-indigo-300 font-medium hover:underline">Create a candidate account</a>
        </p>
      </div>
    </div>

    <!-- Security & Integrity Notice -->
    <p class="text-[11px] text-center text-slate-600 mt-6">
      Protected with secure HTTP-only session cookies and role-based access control.
    </p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Auth.init();
      if (user) {
        window.location.href = '/views/dashboard.html';
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        errorEl.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Authenticating...
        `;

        try {
          const res = await API.auth.login({ email, password });
          if (res.success) {
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect') || '/views/dashboard.html';
            window.location.href = redirect;
          }
        } catch (err) {
          errorEl.textContent = err.message || 'Invalid email or password.';
          errorEl.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
