<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CodeArena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-6">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 font-black text-2xl tracking-tight text-white mb-2">
        <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-mono text-white shadow-lg shadow-indigo-600/30">⚔</span>
        Code<span class="text-indigo-400">Arena</span>
      </a>
      <h2 class="text-xl font-bold text-slate-200">Create an account</h2>
      <p class="text-sm text-slate-400">Join the technical interview platform</p>
    </div>

    <!-- Form Card -->
    <div class="glass-panel p-8 rounded-2xl shadow-2xl">
      <div id="error-message" class="hidden mb-4 p-3 rounded-lg bg-rose-950/40 border border-rose-800 text-xs text-rose-300"></div>

      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
          <input type="text" id="name" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="Alex Rivera" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
          <input type="email" id="email" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="alex@example.com" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
          <input type="password" id="password" required minlength="6" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="••••••••" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Role</label>
          <select id="role" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
            <option value="CANDIDATE">Candidate (Taking interviews)</option>
            <option value="INTERVIEWER">Interviewer (Conducting assessments)</option>
          </select>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white shadow-lg shadow-indigo-600/20 transition text-sm">
          Create Account
        </button>
      </form>

      <p class="text-xs text-center text-slate-500 mt-6">
        Already have an account? <a href="/views/login.html" class="text-indigo-400 hover:underline">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        const errorEl = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        errorEl.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating Account...';

        try {
          const res = await API.auth.register({ name, email, password, role });
          if (res.success) {
            window.location.href = '/views/dashboard.html';
          }
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
